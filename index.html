<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YWEB-OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <div id="taskbar">
      <button id="startButton">Start</button>
      <div id="taskbarApps" aria-label="Open applications"></div>
    </div>

    <div id="startMenu" class="hidden">
      <div class="menu-header">Apps</div>
      <div id="appList"></div>
    </div>

    <div id="windowContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
