<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YWEB-OS</title>
  
  <!-- DaisyUI CSS -->
  <link href="https://cloudflare.com" rel="stylesheet" type="text/css" />
  
  <!-- Tailwind CSS -->
  <script src="https://unpkg.com"></script>
  
  <link rel="stylesheet" href="style.css?v=20260726-1">
</head>

<body>
  <div id="desktop">
    <div id="bootScreen" class="boot-screen">
      <div class="boot-logo">YWEB OS</div>
      <div class="boot-progress">
        <div class="boot-progress-bar"></div>
      </div>
      <div id="bootText" class="boot-text">Initializing system...</div>
    </div>

    <div id="loginScreen" class="login-screen hidden">
      <div class="login-card">
        <div class="login-title">Welcome</div>
        <div class="login-subtitle">Choose a username to continue</div>
        <div class="avatar-picker" id="avatarPicker"></div>
        <input id="usernameInput" class="login-input" type="text" maxlength="24" placeholder="Username" />
        <button id="loginButton" class="login-button">Enter</button>
      </div>
    </div>

    <div id="lockScreen" class="lock-screen hidden">
      <div class="lock-card">
        <div class="lock-avatar" id="lockAvatar">U</div>
        <div class="lock-username" id="lockUsername">User</div>
        <div class="lock-hint">Click anywhere to unlock</div>
      </div>
    </div>

    <div id="taskbar" class="dock-taskbar">
      <button id="startButton">Start</button>
      <div id="taskbarApps" aria-label="Open applications"></div>
      <h3 style="color:white" id ="clock">00.00</h3>
    </div>

    <button id="settingsButton" aria-label="Settings">⚙</button>

    <div id="contextMenu" class="context-menu hidden" role="menu">
      <button class="context-menu-item" data-action="settings">Open Settings</button>
      <button class="context-menu-item" data-action="refresh">Refresh Desktop</button>
    </div>

    <div id="startMenu" class="hidden">
      <div class="menu-header">Apps</div>
      <div id="appList"></div>
    </div>

    <div id="windowContainer"></div>

    <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="settingsTitle">Settings</h2>
          <button id="settingsClose" class="modal-close" aria-label="Close settings">✕</button>
        </div>
        <div class="modal-body">
          <p>Here you can add YWEB-OS settings.</p>
          <div class="setting-row">
            <div>
              <div class="setting-label">Background</div>
              <div class="background-options">
                <button class="background-button" data-background="backgrounds/default1.jpg">Default 1</button>
                <button class="background-button" data-background="backgrounds/default2.jpg">Default 2</button>
                <button class="background-button" data-background="backgrounds/default3.jpg">Default 3</button>
                <button class="background-button" data-background="gradient-default">Gradient</button>
              </div>
            </div>
            <div class="custom-background">
              <label class="custom-background-label" for="customBackgroundInput">Upload Custom Background</label>
              <input type="file" id="customBackgroundInput" accept="image/*">
            </div>
          </div>
          <div class="setting-row theme-selection">
            <div>
              <div class="setting-label">Theme Selection</div>
              <div class="theme-options">
                <button class="theme-button" data-theme="default">Default</button>
                <button class="theme-button" data-theme="cobalt">Cobalt</button>
                <button class="theme-button" data-theme="sunset">Sunset</button>
                <button class="theme-button" data-theme="forest">Forest</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js?v=20260726-1"></script>
  <script src="console-app.js?v=20260726-1"></script>
</body>
</html>
